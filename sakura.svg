<g class="f2" transform="translate(770,3)" style="animation-duration:4.4s;animation-delay:3.0s"><ellipse cx="0" cy="-5" rx="2.5" ry="5" fill="#ffb7c5" transform="rotate(0)"/><ellipse cx="0" cy="-5" rx="2.5" ry="5" fill="#ffd6e0" transform="rotate(72)"/><ellipse cx="0" cy="-5" rx="2.5" ry="5" fill="#ffb7c5" transform="rotate(144)"/><ellipse cx="0" cy="-5" rx="2.5" ry="5" fill="#ffc8d3" transform="rotate(216)"/><ellipse cx="0" cy="-5" rx="2.5" ry="5" fill="#ffb7c5" transform="rotate(288)"/></g>
