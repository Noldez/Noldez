<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 80" width="100%" height="80">
<defs>
<style>
.f{animation:fall linear infinite;opacity:0}
@keyframes fall{
  0%  {opacity:0;   transform:translate(0px,0px)   rotate(0deg)}
  8%  {opacity:.95}
  92% {opacity:.8}
  100%{opacity:0;   transform:translate(18px,90px)  rotate(400deg)}
}
.f2{animation:fall2 linear infinite;opacity:0}
@keyframes fall2{
  0%  {opacity:0;   transform:translate(0px,0px)   rotate(0deg)}
  8%  {opacity:.85}
  92% {opacity:.75}
  100%{opacity:0;   transform:translate(-20px,90px) rotate(-380deg)}
}
.f3{animation:fall3 linear infinite;opacity:0}
@keyframes fall3{
  0%  {opacity:0;   transform:translate(0px,0px)   rotate(0deg)}
  8%  {opacity:.9}
  92% {opacity:.7}
  100%{opacity:0;   transform:translate(8px,90px)   rotate(300deg)}
}
</style>
</defs>

<!-- petal macro: 5 rotated ellipses = cherry blossom -->
<g class="f"  transform="translate(30,5)"  style="animation-duration:4.2s;animation-delay:0.0s"><ellipse cx="0" cy="-5" rx="2.5" ry="5" fill="#ffb7c5" transform="rotate(0)"/><ellipse cx="0" cy="-5" rx="2.5" ry="5" fill="#ffc8d3" transform="rotate(72)"/><ellipse cx="0" cy="-5" rx="2.5" ry="5" fill="#ffb7c5" transform="rotate(144)"/><ellipse cx="0" cy="-5" rx="2.5" ry="5" fill="#ffd6e0" transform="rotate(216)"/><ellipse cx="0" cy="-5" rx="2.5" ry="5" fill="#ffb7c5" transform="rotate(288)"/></g>
